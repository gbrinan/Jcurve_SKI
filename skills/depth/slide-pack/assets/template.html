<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- TITLE --></title>
<style>
  :root {
    --bg: #0f1420;
    --surface: #1a2233;
    --line: #2c3a55;
    --text: #e8edf7;
    --muted: #93a1bd;
    --accent: #ffb454;
    --accent2: #5ec8f8;
    --ok: #7dd486;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  .deck { height: 100%; display: flex; align-items: center; justify-content: center; }
  .slide {
    display: none; width: min(96vw, 177.6vh); aspect-ratio: 16/9;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: clamp(24px, 5vh, 56px) clamp(28px, 6vw, 72px);
    flex-direction: column; justify-content: center; gap: clamp(12px, 2.5vh, 26px);
    overflow: hidden;
  }
  .slide.active { display: flex; }
  .kicker { color: var(--accent); font-size: clamp(12px, 1.6vh, 17px); font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase; }
  h1 { font-size: clamp(28px, 6vh, 56px); line-height: 1.2; }
  h2 { font-size: clamp(20px, 4.2vh, 38px); line-height: 1.25; }
  .sub { color: var(--muted); font-size: clamp(14px, 2.2vh, 21px); line-height: 1.5; }
  ul { list-style: none; display: flex; flex-direction: column; gap: clamp(8px, 1.8vh, 16px); }
  ul li { padding-left: 1.2em; position: relative; font-size: clamp(14px, 2.4vh, 22px); line-height: 1.45; }
  ul li::before { content: "▸"; position: absolute; left: 0; color: var(--accent2); }
  strong { color: var(--accent); font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: clamp(12px, 2vh, 18px); }
  th { text-align: left; color: var(--accent2); border-bottom: 2px solid var(--line);
    padding: .45em .6em; font-weight: 700; }
  td { border-bottom: 1px solid var(--line); padding: .45em .6em; line-height: 1.4; }
  .pill { display: inline-block; background: var(--bg); border: 1px solid var(--line);
    border-radius: 999px; padding: .2em .8em; color: var(--accent2);
    font-size: clamp(11px, 1.7vh, 15px); }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: clamp(10px, 2vh, 20px); font-size: clamp(11px, 1.9vh, 17px); line-height: 1.5;
    overflow-x: auto; font-family: "D2Coding", Consolas, monospace; color: var(--text); }
  .pager { position: fixed; right: 22px; bottom: 16px; color: var(--muted);
    font-size: 14px; font-variant-numeric: tabular-nums; }
  .hint { position: fixed; left: 22px; bottom: 16px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="deck">
<!-- SLIDES -->
</div>
<div class="pager"><span id="cur">1</span> / <span id="total">1</span></div>
<div class="hint">← → · 스페이스 · 클릭으로 이동</div>
<script>
  const slides = [...document.querySelectorAll('.slide')];
  let i = 0;
  document.getElementById('total').textContent = slides.length;
  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((s, k) => s.classList.toggle('active', k === i));
    document.getElementById('cur').textContent = i + 1;
  }
  addEventListener('keydown', e => {
    if (['ArrowRight', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); show(i + 1); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); show(i - 1); }
    if (e.key === 'Home') show(0);
    if (e.key === 'End') show(slides.length - 1);
  });
  addEventListener('click', e => show(e.clientX < innerWidth / 3 ? i - 1 : i + 1));
  show(0);
</script>
</body>
</html>
