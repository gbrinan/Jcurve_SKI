<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- TITLE --></title>
<style>
  :root {
    --nav-accent: var(--accent);
    --barh: 46px;
    --bg: #0f1420;
    --surface: #1a2233;
    --line: #2c3a55;
    --text: #e8edf7;
    --muted: #93a1bd;
    --accent: #ffb454;
    --accent2: #5ec8f8;
    --ok: #7dd486;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  .deck { height: calc(100% - var(--barh)); display: flex; align-items: center; justify-content: center; }
  .slide {
    display: none; width: min(96vw, calc((100vh - var(--barh)) * 1.776)); aspect-ratio: 16/9;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: clamp(24px, 5vh, 56px) clamp(28px, 6vw, 72px);
    flex-direction: column; justify-content: center; gap: clamp(12px, 2.5vh, 26px);
    overflow: hidden;
  }
  .slide.active { display: flex; }
  .kicker { color: var(--accent); font-size: clamp(12px, 1.6vh, 17px); font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase; }
  h1 { font-size: clamp(28px, 6vh, 56px); line-height: 1.2; }
  h2 { font-size: clamp(20px, 4.2vh, 38px); line-height: 1.25; }
  .sub { color: var(--muted); font-size: clamp(14px, 2.2vh, 21px); line-height: 1.5; }
  ul { list-style: none; display: flex; flex-direction: column; gap: clamp(8px, 1.8vh, 16px); }
  ul li { padding-left: 1.2em; position: relative; font-size: clamp(14px, 2.4vh, 22px); line-height: 1.45; }
  ul li::before { content: "▸"; position: absolute; left: 0; color: var(--accent2); }
  strong { color: var(--accent); font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: clamp(12px, 2vh, 18px); }
  th { text-align: left; color: var(--accent2); border-bottom: 2px solid var(--line);
    padding: .45em .6em; font-weight: 700; }
  td { border-bottom: 1px solid var(--line); padding: .45em .6em; line-height: 1.4; }
  .pill { display: inline-block; background: var(--bg); border: 1px solid var(--line);
    border-radius: 999px; padding: .2em .8em; color: var(--accent2);
    font-size: clamp(11px, 1.7vh, 15px); }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: clamp(10px, 2vh, 20px); font-size: clamp(11px, 1.9vh, 17px); line-height: 1.5;
    overflow-x: auto; font-family: "D2Coding", Consolas, monospace; color: var(--text); }
  .slide.active { animation: slideIn .28s cubic-bezier(.22,1,.36,1) both; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(var(--dir, 24px)); }
    to { opacity: 1; transform: none; } }
  /* ── 내비게이션 (템플릿 공통) ─────────────────────────── */
  .prog { position: fixed; top: 0; left: 0; height: 3px; width: 0;
    background: var(--nav-accent); transition: width .25s ease; z-index: 60; }
  .navzone { position: fixed; top: 0; bottom: var(--barh); width: 7%; min-width: 54px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    opacity: 0; transition: opacity .15s ease; z-index: 40;
    font-size: 30px; color: var(--muted); user-select: none; border: 0; background: none; }
  .navzone.l { left: 0; } .navzone.r { right: 0; }
  .navzone:hover, .navzone:focus-visible { opacity: 1; }
  .navzone:disabled { cursor: default; }
  .navzone:disabled:hover { opacity: 0; }
  /* 하단 바 — 슬라이드와 겹치지 않는 별도 영역 */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; height: var(--barh);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 12px; padding: 0 22px; background: var(--bg); border-top: 1px solid var(--line);
    z-index: 50; }
  .dots { display: flex; gap: 9px; align-items: center; justify-self: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: var(--line); transition: background .15s ease, transform .15s ease; position: relative; }
  .dot:hover { background: var(--muted); transform: scale(1.25); }
  .dot.on { background: var(--nav-accent); transform: scale(1.35); }
  .dot::after { content: attr(data-label); position: absolute; bottom: 20px; left: 50%;
    transform: translateX(-50%); white-space: nowrap; background: var(--text); color: var(--bg);
    padding: 5px 9px; border-radius: 6px; font-size: 12px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity .12s ease; }
  .dot:hover::after, .dot:focus-visible::after { opacity: 1; }
  .pager { justify-self: end; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .pager b { color: var(--nav-accent); font-weight: 700; }
  .hint { justify-self: start; color: var(--muted); font-size: 13px; }
  .hint b { color: var(--text); font-weight: 700; }
  /* 목차 패널 (O 키) */
  .toc { position: fixed; inset: 0; background: var(--bg); z-index: 70;
    display: none; flex-direction: column; padding: clamp(28px, 6vh, 64px) clamp(24px, 8vw, 96px);
    gap: 6px; overflow-y: auto; }
  .toc.on { display: flex; }
  .toc h3 { color: var(--nav-accent); font-size: 13px; letter-spacing: .12em;
    text-transform: uppercase; margin-bottom: 14px; }
  .toc button { display: flex; width: 100%; gap: 14px; align-items: baseline; text-align: left;
    background: none; border: 0; border-bottom: 1px solid var(--line); cursor: pointer;
    padding: 13px 6px; color: var(--text); font: inherit; font-size: clamp(15px, 2.2vh, 20px); }
  .toc button:hover, .toc button:focus-visible { background: var(--line); }
  .toc button.on { color: var(--nav-accent); font-weight: 700; }
  .toc button .n { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums;
    min-width: 2.2em; }
  .toc button .k { color: var(--muted); font-size: 12px; margin-left: auto; padding-left: 16px; }
  @media (max-width: 720px) { .navzone { width: 12%; } .dots { display: none; } }
  @media (prefers-reduced-motion: reduce) {
    .prog, .dot, .navzone { transition: none; }
    .slide.active { animation: none !important; }
  }
</style>
</head>
<body>
<div class="deck">
<!-- SLIDES -->
</div>
<div class="prog" id="prog"></div>
<button class="navzone l" id="navL" aria-label="이전 슬라이드">‹</button>
<button class="navzone r" id="navR" aria-label="다음 슬라이드">›</button>
<div class="bar">
  <div class="hint">← → 이동 · <b>O</b> 목차 · 숫자키 점프</div>
  <nav class="dots" id="dots" aria-label="슬라이드 이동"></nav>
  <div class="pager"><b id="cur">1</b> / <span id="total">1</span></div>
</div>
<div class="toc" id="toc" role="dialog" aria-label="목차">
  <h3>목차 — 클릭하면 이동합니다 (Esc 닫기)</h3>
  <div id="tocList"></div>
</div>
<script>
(function () {
  var slides = [].slice.call(document.querySelectorAll('.slide'));
  var i = 0, last = 0;
  var elCur = document.getElementById('cur'), elTotal = document.getElementById('total');
  var elProg = document.getElementById('prog'), elDots = document.getElementById('dots');
  var elToc = document.getElementById('toc'), elTocList = document.getElementById('tocList');
  var navL = document.getElementById('navL'), navR = document.getElementById('navR');
  elTotal.textContent = slides.length;

  /* 슬라이드 제목 = kicker > h1 > h2 순으로 사용 */
  function labelOf(s, n) {
    var k = s.querySelector('.kicker'), h = s.querySelector('h1, h2');
    var t = (k && k.textContent.trim()) || (h && h.textContent.trim()) || ('슬라이드 ' + n);
    return t.replace(/\s+/g, ' ');
  }
  var labels = slides.map(labelOf);

  /* 도트 + 목차 생성 */
  slides.forEach(function (s, n) {
    var d = document.createElement('button');
    d.className = 'dot'; d.setAttribute('data-label', (n + 1) + '. ' + labels[n]);
    d.setAttribute('aria-label', labels[n]);
    d.onclick = function () { show(n); };
    elDots.appendChild(d);

    var b = document.createElement('button');
    var h = s.querySelector('h1, h2');
    b.innerHTML = '<span class="n">' + String(n + 1).padStart(2, '0') + '</span>' +
      '<span>' + ((h && h.textContent.trim()) || labels[n]) + '</span>' +
      '<span class="k">' + labels[n] + '</span>';
    b.onclick = function () { show(n); toc(false); };
    elTocList.appendChild(b);
  });
  var dots = [].slice.call(elDots.children), tocBtns = [].slice.call(elTocList.children);

  function show(n) {
    last = i;
    i = Math.max(0, Math.min(slides.length - 1, n));
    var dir = i >= last ? 24 : -24;
    slides.forEach(function (s, k) {
      s.classList.toggle('active', k === i);
      if (k === i) { s.style.setProperty('--dir', dir + 'px'); }
    });
    dots.forEach(function (d, k) { d.classList.toggle('on', k === i); });
    tocBtns.forEach(function (b, k) { b.classList.toggle('on', k === i); });
    elCur.textContent = i + 1;
    elProg.style.width = ((i + 1) / slides.length * 100) + '%';
    navL.disabled = i === 0; navR.disabled = i === slides.length - 1;
    if (location.hash !== '#s' + (i + 1)) history.replaceState(null, '', '#s' + (i + 1));
  }
  function toc(on) { elToc.classList.toggle('on', on); }

  navL.onclick = function () { show(i - 1); };
  navR.onclick = function () { show(i + 1); };

  addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { toc(false); return; }
    if (e.key === 'o' || e.key === 'O' || e.key === 'ㅐ') { toc(!elToc.classList.contains('on')); return; }
    if (['ArrowRight', ' ', 'PageDown'].indexOf(e.key) >= 0) { e.preventDefault(); show(i + 1); }
    if (['ArrowLeft', 'PageUp'].indexOf(e.key) >= 0) { e.preventDefault(); show(i - 1); }
    if (e.key === 'Home') show(0);
    if (e.key === 'End') show(slides.length - 1);
    if (/^[1-9]$/.test(e.key)) show(parseInt(e.key, 10) - 1);
  });

  /* 터치 스와이프 — 본문 클릭은 넘기지 않는다(표·텍스트 선택 보호) */
  var x0 = null;
  addEventListener('touchstart', function (e) { x0 = e.changedTouches[0].clientX; }, { passive: true });
  addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) show(dx < 0 ? i + 1 : i - 1);
    x0 = null;
  }, { passive: true });

  var h = parseInt((location.hash.match(/^#s(\d+)$/) || [])[1], 10);
  show(h ? h - 1 : 0);
})();
</script>
</body>
</html>
